<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0C0F14">
<title>Pitinvest App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0C0F14; --panel:#141A24; --panel2:#0F141D; --line:#232D3E; --line2:#1A2230;
  --ink:#EAF0F8; --ink2:#94A3B8; --ink3:#5A6779;
  --amber:#FFB224; --green:#31D07A; --red:#FF5C5C; --warn:#FFC53D; --blue:#8FB8DD;
  --disp:'Saira Condensed',sans-serif; --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif;
  --hdr:52px; --menu:238px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;min-height:100vh}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--blue);text-decoration:none}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* ---------- Cabecera ---------- */
header{position:sticky;top:0;z-index:30;height:var(--hdr);display:flex;align-items:center;gap:10px;
  padding:0 14px;background:rgba(12,15,20,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{font-family:var(--disp);font-weight:800;font-size:23px;letter-spacing:.13em;text-transform:uppercase;white-space:nowrap}
.brand em{color:var(--blue);font-style:normal}
.hstat{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink3);text-align:right;line-height:1.3}
.hstat b{display:block;color:var(--ink2);font-weight:500}
.ibtn{border:1px solid var(--line);border-radius:9px;padding:7px 11px;color:var(--ink2);font-size:15px;background:var(--panel)}
.ibtn:hover{border-color:var(--ink3);color:var(--ink)}

/* ---------- Menú lateral ---------- */
.shell{display:grid;grid-template-columns:var(--menu) minmax(0,1fr);min-height:calc(100vh - var(--hdr))}
.menu{border-right:1px solid var(--line);display:flex;flex-direction:column;
  position:sticky;top:var(--hdr);height:calc(100vh - var(--hdr));overflow:hidden}
.menu-nav{padding:14px 10px 0;display:flex;flex-direction:column;gap:5px;flex:none}
.nv{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:11px 13px;border-radius:10px;
  color:var(--ink2);font-size:15px;font-weight:500;border:1px solid transparent;flex:none}
.nv .ic{width:20px;text-align:center;font-size:16px;color:var(--ink3);flex:none}
.nv:hover{color:var(--ink);background:var(--panel)}
.nv.on{color:var(--ink);background:var(--panel);border-color:var(--line)}
.nv.on .ic{color:var(--blue)}
.nv-sep{height:1px;background:var(--line);margin:7px 8px;flex:none}

/* Panel de fichas, dentro del menú y justo bajo el botón Fichas */
.fpanel{display:none;flex-direction:column;min-height:0;flex:1;margin-top:8px}
.fpanel.on{display:flex}
.fp-top{padding:0 10px 9px;display:flex;flex-direction:column;gap:8px;flex:none}
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 11px}
.search input{flex:1;background:none;border:0;outline:none;padding:10px 0;font-family:var(--mono);font-size:14px;min-width:0}
.search input::placeholder{font-family:var(--sans);color:var(--ink3)}
.search .mag{color:var(--ink3)}
.search .clr{color:var(--ink3);font-size:18px;padding:4px}
.filters{display:flex;flex-wrap:wrap;gap:5px}
.fchip{border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12.5px;color:var(--ink2);background:var(--panel2);white-space:nowrap}
.fchip.on{color:#14100A;background:var(--blue);border-color:var(--blue);font-weight:600}
.list{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border-top:1px solid var(--line2)}
.litem{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:10px 13px;border-bottom:1px solid var(--line2)}
.litem:hover{background:var(--panel)}
.litem.sel{background:var(--panel);box-shadow:inset 3px 0 0 var(--blue)}
.ldot{width:7px;height:7px;border-radius:50%;flex:none}
.d-cartera{background:var(--green)} .d-watchlist{background:var(--amber)} .d-descartada{background:var(--ink3)} .d-otro{background:var(--blue)}
.lmain{flex:1;min-width:0}
.ltick{font-family:var(--mono);font-weight:600;font-size:13.5px;color:var(--ink)}
.lname{font-size:12px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lprice{font-family:var(--mono);font-size:12.5px;color:var(--ink2);text-align:right;flex:none}
.lempty{padding:22px 14px;color:var(--ink3);font-size:13.5px;text-align:center}

.view{display:none}
.view.on{display:block}

/* ---------- Contenido ---------- */
.wrap{max-width:900px;padding:18px 20px 70px}
.wrap.ancho{max-width:1500px}
.scr{font-family:var(--disp);font-size:25px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.scr-sub{font-family:var(--mono);font-size:12px;color:var(--ink3)}
.scr-h{display:flex;align-items:center;gap:13px;margin-bottom:17px;flex-wrap:wrap}
.wknav{display:flex;align-items:center;gap:6px;margin-left:auto}
.wkb{border:1px solid var(--line);background:var(--panel);border-radius:9px;color:var(--ink2);padding:7px 12px;font-size:14px}
.wkb:hover{border-color:var(--ink3);color:var(--ink)}
.wkb.hoy{font-size:12.5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:13px}
.card>h3{font-family:var(--disp);font-size:17px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink2);margin-bottom:11px;display:flex;align-items:center;gap:9px}
.card>h3 .cnt{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--ink3);letter-spacing:0;text-transform:none}
.card.hoy{border-color:rgba(143,184,221,.55);box-shadow:0 0 0 1px rgba(143,184,221,.2)}
.card .col-f{margin-left:0} .card .hoy-b{margin-left:auto}
.sesion{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);
  margin:12px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line2)}
.sesion:first-child{margin-top:0}
.vacio{color:var(--ink3);font-style:italic;font-size:14px;padding:3px 0}

/* Semana en columnas */
.semana{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:11px;align-items:start}
.col{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px;min-height:120px}
.col.hoy{border-color:rgba(143,184,221,.55);box-shadow:0 0 0 1px rgba(143,184,221,.2)}
.col-h{display:flex;align-items:baseline;gap:7px;margin-bottom:11px;padding-bottom:8px;border-bottom:1px solid var(--line2)}
.col-n{font-family:var(--disp);font-size:16px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.col-f{font-family:var(--mono);font-size:16px;color:var(--ink3);margin-left:auto}
.col.hoy .col-f{color:var(--blue)}
.col-s{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3);margin:11px 0 6px}
.col-s:first-of-type{margin-top:0}
.col-v{color:var(--ink3);font-style:italic;font-size:13px}

/* Fila compacta dentro de una columna */
.cr{display:flex;align-items:center;gap:7px;width:100%;text-align:left;padding:7px 9px;margin-bottom:5px;
  border-radius:8px;background:var(--panel2);border-left:3px solid var(--line2)}
.cr.cartera{border-left-color:var(--blue);background:rgba(143,184,221,.08)}
.cr.watchlist{border-left-color:var(--amber);background:rgba(255,178,36,.07)}
.cr.cartera:hover,.cr.watchlist:hover{filter:brightness(1.25)}
.cr-t{font-family:var(--mono);font-weight:600;font-size:12.5px;color:var(--ink2);flex:none}
.cr.cartera .cr-t{color:var(--blue)} .cr.watchlist .cr-t{color:var(--amber)}
.cr-n{font-size:12.5px;color:var(--ink);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cr-b{font-family:var(--mono);font-size:10px;padding:2px 5px;border-radius:4px;flex:none;font-weight:600}
.cr-b.hit{background:rgba(49,208,122,.2);color:var(--green)}
.cr-b.near{background:rgba(255,197,61,.2);color:var(--warn)}
.cr-nota{font-size:11.5px;color:var(--ink3);line-height:1.4;padding:0 9px 7px;margin-top:-3px}

/* Macro en columna */
.mc{padding:8px 2px;border-bottom:1px dashed var(--line2)}
.mc:last-child{border-bottom:0}
.mc-top{display:flex;align-items:baseline;gap:8px}
.mc-h{font-family:var(--mono);font-size:13px;font-weight:600;flex:none}
.mc-i{width:7px;height:7px;border-radius:50%;flex:none}
.ii-alta{background:var(--red)} .ii-media{background:var(--warn)} .ii-baja{background:var(--ink3)}
.mc-e{font-size:13px;line-height:1.4;margin-top:2px}
.mc-n{font-size:11.5px;color:var(--ink3);margin-top:3px;line-height:1.4}

/* Fila de resultados ancha (agenda) */
.er{display:flex;align-items:center;flex-wrap:wrap;gap:9px;width:100%;text-align:left;
  padding:10px 11px;border:1px solid var(--line);border-left:3px solid var(--line);border-radius:10px;
  background:var(--panel2);margin-bottom:7px}
.er.cartera{border-left-color:var(--blue);background:rgba(143,184,221,.07)}
.er.watchlist{border-left-color:var(--amber);background:rgba(255,178,36,.06)}
.er.cartera:hover,.er.watchlist:hover{filter:brightness(1.2)}
.er-t{font-family:var(--mono);font-weight:600;font-size:15px;color:var(--ink2);flex:none}
.er.cartera .er-t{color:var(--blue)} .er.watchlist .er-t{color:var(--amber)}
.er-n{font-size:14px;color:var(--ink);flex:1;min-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.er-m{font-family:var(--mono);font-size:10.5px;color:var(--ink3);border:1px solid var(--line);border-radius:5px;padding:2px 6px;flex:none}
.er-d{font-family:var(--mono);font-size:12.5px;flex:none}
.er-d.hit{color:var(--green)} .er-d.near{color:var(--warn)} .er-d.far{color:var(--ink2)}
.er-go{color:var(--blue);font-size:15px;flex:none}
.er-nota{flex:1 1 100%;font-size:13px;color:var(--ink2);line-height:1.45}
.ses-b{font-family:var(--mono);font-size:10px;padding:2px 6px;border-radius:5px;flex:none;letter-spacing:.06em}
.b-bmo{background:rgba(240,163,92,.16);color:#f0a35c} .b-amc{background:rgba(167,139,250,.16);color:#a78bfa}

/* Macro ancha (agenda) */
.mr{display:flex;align-items:baseline;flex-wrap:wrap;gap:10px;padding:9px 2px;border-bottom:1px dashed var(--line2)}
.mr:last-child{border-bottom:0}
.mr-h{font-family:var(--mono);font-size:14px;font-weight:600;width:48px;flex:none}
.mr-e{flex:1;min-width:140px;font-size:14.5px}
.mr-i{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:5px;flex:none}
.i-alta{background:rgba(255,92,92,.16);color:var(--red)}
.i-media{background:rgba(255,197,61,.14);color:var(--warn)}
.i-baja{background:rgba(148,163,184,.13);color:var(--ink3)}
.mr-n{flex:1 1 100%;font-size:13px;color:var(--ink2)}

/* Pendientes */
.pd{display:flex;align-items:flex-start;gap:11px;padding:11px 2px;border-bottom:1px dashed var(--line2)}
.pd:last-child{border-bottom:0}
.pd-f{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:6px;flex:none;min-width:62px;text-align:center;
  border:1px solid var(--line);color:var(--ink3);background:var(--panel2)}
.pd-f.urge{color:var(--red);border-color:rgba(255,92,92,.45);background:rgba(255,92,92,.08);font-weight:600}
.pd-f.pronto{color:var(--warn);border-color:rgba(255,197,61,.4)}
.pd-b{flex:1;min-width:0}
.pd-a{font-size:14.5px;font-weight:600}
.pd.urge .pd-a{color:#ffb3b3}
.pd-d{font-size:13px;color:var(--ink2);margin-top:2px;line-height:1.5}

/* ---------- Ficha ---------- */
.detail{padding:18px 22px 70px;max-width:880px}
.dhead{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:4px}
.dname{font-family:var(--disp);font-size:31px;font-weight:700;letter-spacing:.03em;line-height:1.08}
.dtick{font-family:var(--mono);font-size:15px;color:var(--blue);margin-left:9px}
.dchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{font-family:var(--mono);font-size:11.5px;padding:3px 9px;border-radius:6px;border:1px solid var(--line);color:var(--ink2);background:var(--panel2);text-transform:uppercase;letter-spacing:.04em}
.chip.est-cartera{color:var(--green);border-color:rgba(49,208,122,.4)}
.chip.est-watchlist{color:var(--amber);border-color:rgba(255,178,36,.4)}
.chip.est-descartada{color:var(--ink3)}
.quote{display:flex;align-items:center;flex-wrap:wrap;gap:16px;margin-top:14px}
.q-price{font-family:var(--mono);font-size:30px;font-weight:600;line-height:1}
.q-per{font-family:var(--mono);font-size:14px;color:var(--ink2)}
.q-per b{color:var(--ink);font-weight:600}
.verd{font-family:var(--disp);font-size:14px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:5px 12px;border-radius:7px}
.v-barata{background:rgba(49,208,122,.15);color:var(--green);border:1px solid rgba(49,208,122,.35)}
.v-cara{background:rgba(244,114,182,.14);color:#f9a8d4;border:1px solid rgba(244,114,182,.35)}
.v-media{background:rgba(255,178,36,.14);color:var(--amber);border:1px solid rgba(255,178,36,.35)}
.v-nd{background:var(--panel2);color:var(--ink3);border:1px solid var(--line)}
.btn-mini{background:var(--panel2);border:1px solid var(--line);color:var(--ink2);border-radius:9px;font-size:13.5px;padding:8px 13px}
.btn-mini:hover{color:var(--ink);border-color:var(--ink3)}
.btn{background:var(--blue);color:#0C0F14;border:0;border-radius:11px;font-weight:600;font-size:15px;padding:0 22px}
.btn:hover{filter:brightness(1.08)} .btn:disabled{opacity:.5;cursor:wait}

.tabs{display:flex;gap:7px;margin:18px 0 0}
.tab{border:1px solid var(--line);border-bottom:0;border-radius:11px 11px 0 0;padding:11px 22px;
  background:#10151c;color:var(--ink3);font-family:var(--disp);font-size:16px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.tab.on{background:var(--panel);color:var(--blue);box-shadow:inset 0 3px 0 var(--blue)}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:0 13px 13px 13px;padding:16px}
.pane[hidden]{display:none}

h4.sec{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);
  margin:20px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line2)}
h4.sec:first-child{margin-top:0}
.txt{font-size:15px;line-height:1.62;color:var(--ink);white-space:pre-wrap}
.txt.dim{color:var(--ink2)}
.nd{color:var(--ink3);font-style:italic;font-size:14px}

.pilar{border:1px solid var(--line);border-left:3px solid var(--ink3);border-radius:10px;padding:12px 14px;margin-bottom:9px;background:var(--panel2)}
.pilar.ok{border-left-color:var(--green)} .pilar.ko{border-left-color:var(--red)} .pilar.mid{border-left-color:var(--warn)}
.pilar .pt{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.pilar .pm{font-family:var(--disp);font-size:13px;letter-spacing:.06em;font-weight:700}
.pilar.ok .pm{color:var(--green)} .pilar.ko .pm{color:var(--red)} .pilar.mid .pm{color:var(--warn)}

.niv{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;
  margin-bottom:8px;background:var(--panel2)}
.niv .nlab{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);width:74px;flex:none}
.niv .nval{font-family:var(--mono);font-size:17px;font-weight:600;flex:none}
.niv .ndist{font-family:var(--mono);font-size:13px;margin-left:auto;text-align:right}
.niv.hit{border-color:rgba(49,208,122,.45);background:rgba(49,208,122,.07)}
.niv.near{border-color:rgba(255,197,61,.45);background:rgba(255,197,61,.06)}
.niv.hit .ndist{color:var(--green)} .niv.near .ndist{color:var(--warn)} .niv .ndist{color:var(--ink2)}

.hrow{border-left:2px solid var(--line);padding:0 0 14px 14px;position:relative}
.hrow:last-child{padding-bottom:0}
.hrow::before{content:'';position:absolute;left:-5px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--blue)}
.hmeta{display:flex;align-items:center;gap:9px;margin-bottom:3px}
.hdate{font-family:var(--mono);font-size:12px;color:var(--ink2)}
.hag{font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:5px;background:var(--panel2);border:1px solid var(--line);color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.hnota{font-size:14.5px;line-height:1.6;color:var(--ink2)}

/* ---------- Valoración ---------- */
.crit{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:11px 12px;border-radius:10px}
.crit:nth-child(even){background:rgba(255,255,255,.02)}
.crit .lbl{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--ink2)}
.crit .dash{color:var(--ink3)}
.crit .val{font-family:var(--mono);font-size:16px;font-weight:600;white-space:nowrap}
.crit .val.ok{color:var(--green)} .crit .val.mid{color:var(--warn)} .crit .val.ko{color:var(--red)} .crit .val.nd{color:var(--ink3)}
.crit .rng{color:var(--ink3);font-weight:400;font-family:var(--mono);font-size:12.5px;text-transform:none}
.med{font-family:var(--mono);font-size:12.5px;color:var(--ink3);border:1px solid var(--line);border-radius:6px;padding:3px 9px;background:var(--panel2)}
.med.sec{color:var(--blue);border-color:rgba(143,184,221,.35);background:rgba(143,184,221,.07)}
.trendwrap{display:inline-flex;align-items:center;gap:7px}
.trendwrap svg{display:block}
.trendlab{font-family:var(--mono);font-size:12px}
.cands{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.cand{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 16px;text-align:left;color:var(--ink);width:100%}
.cand:hover{border-color:var(--blue)}
.cand .sym{font-family:var(--mono);font-weight:600;font-size:16px;color:var(--blue);width:90px;flex:none}
.cand .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cand .ex{font-family:var(--mono);font-size:12px;color:var(--ink3);flex:none}
.notice{margin-top:14px;padding:12px 15px;border-radius:11px;font-size:14.5px;line-height:1.6;display:none}
.notice.err{display:block;background:rgba(255,92,92,.08);border:1px solid rgba(255,92,92,.3);color:#ffb3b3}
.notice.info{display:block;background:rgba(143,184,221,.08);border:1px solid rgba(143,184,221,.3);color:#cfe3f5}
.desc{color:var(--ink2);font-size:14.5px;margin-top:12px;max-width:660px;line-height:1.6}

.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;height:55vh;gap:10px;color:var(--ink3);text-align:center;padding:20px}
.ph .big{font-family:var(--disp);font-size:22px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.err{margin:16px 0;padding:14px 16px;border-radius:11px;background:rgba(255,92,92,.08);border:1px solid rgba(255,92,92,.3);color:#ffb3b3;font-size:14px;line-height:1.6}

<script>
'use strict';

/* ═══════════ CONFIG ═══════════
   Sheet FICHAS EMPRESAS vía "Publicar en la web" (documento completo), una URL por gid.
   Si añades una pestaña nueva, su gid sale en la URL del Sheet al abrirla (…#gid=XXXXX).
   CSV_URL es un atajo: una URL completa ahí manda sobre todo lo demás. */
const PUB = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRNo2O9533CznKAtQ6BRYvGHOVYDUaMv9qcrSCErlvENSyF6U35fckkGL7-x0QQtnAhSSaMpFL9BbiO/pub';
const GID = { FICHAS:'0', HISTORIAL:'457418746', CALENDARIO:'877920489', MACRO:'1130086902',
              PENDIENTES:'1011136016', SECTORES:'402170160' };
const SHEET_ID = '13N6wS20II5XgOq5HtqdTfccvZFJuT4q7_jrao8Koyzg';
const CSV_URL = { FICHAS:'', HISTORIAL:'', CALENDARIO:'', MACRO:'', PENDIENTES:'', SECTORES:'' };

/* La cartera completa vive en su propio Sheet ("cartera para ia"), que se
   actualiza solo y no lleva cifras. Solo se usa para saber qué es suyo.
   Para que la app lo lea hay que publicarlo: Archivo → Compartir → Publicar en
   la web. Pega aquí la URL que te dé (la que empieza por .../d/e/2PACX-…/pub);
   mientras esté vacío se intenta por id, que no siempre deja leerlo desde fuera. */
const CARTERA_SHEET_ID = '1PXihCz2FIJjIVPAFCWLg5F9cTItCWeG9wTy6_6gdqiE';
const CARTERA_PUB = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSXSofvMaT7bYXduO3ywx6Pg5q-cZccTc2GcitfKbv9pvqaDIW_0xR2RHamWwt1h6KVxpf5Vm0EwLe-/pub';
const CERCA = 0.08;               // ámbar si falta un 8% o menos para el nivel
const DIAS_PENDIENTES = 7;
const LS = 'fichas_cache_v2';
const LS_WORKER = 'momentum_worker_url';   // misma clave que la app anterior: comparte worker

const gviz = (tab) => `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tab)}`;
const pub  = (tab) => `${PUB}?gid=${GID[tab]}&single=true&output=csv`;
const cacheBust = (b) => b + (b.includes('?') ? '&' : '?') + 't=' + Date.now();
function urlDe(tab){
  return cacheBust((CSV_URL[tab] || '').trim() || (GID[tab] != null ? pub(tab) : gviz(tab)));
}
/* Varias formas de pedir el mismo CSV; se prueban en orden hasta que una responda.
   La publicación necesita el gid de la pestaña: sin él Google devuelve HTML, no CSV. */
function urlsCartera(){
  const p = (CARTERA_PUB || '').trim().replace(/\/pubhtml.*$/, '/pub');
  const u = [];
  if(p){
    u.push(p + '?output=csv');                 // la forma que ya usa PITrader App con este Sheet
    u.push(p + '?gid=0&single=true&output=csv');
  }
  u.push(`https://docs.google.com/spreadsheets/d/${CARTERA_SHEET_ID}/gviz/tq?tqx=out:csv`);
  return u.map(cacheBust);
}

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const has = (s) => s != null && String(s).trim() !== '';

/* ═══════════ CSV ═══════════ */
function parseCSV(text){
  const rows=[]; let row=[], cur='', q=false;
  text = String(text).replace(/^﻿/,'');
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=c;
    }else{
      if(c==='"') q=true;
      else if(c===','){ row.push(cur); cur=''; }
      else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
      else if(c!=='\r') cur+=c;
    }
  }
  if(cur!=='' || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim()!==''));
}

/* Números del Sheet: configuración española (coma decimal, punto de miles) */
function num(s){
  if(s==null) return null;
  let v = String(s).trim().replace(/[€$£%\s ]/g,'');
  if(!v || v==='-' || v==='—' || /^#/.test(v)) return null;
  const neg = /^-/.test(v); v = v.replace(/^-/,'');
  const c = v.includes(','), d = v.includes('.');
  if(c && d){
    if(v.lastIndexOf(',') > v.lastIndexOf('.')) v = v.replace(/\./g,'').replace(',','.');
    else v = v.replace(/,/g,'');
  } else if(c){
    v = /^\d{1,3}(,\d{3})+$/.test(v) ? v.replace(/,/g,'') : v.replace(',','.');
  } else if(d){
    if(/^\d{1,3}(\.\d{3})+$/.test(v)) v = v.replace(/\./g,'');
  }
  const n = parseFloat(v);
  if(isNaN(n)) return null;
  return neg ? -n : n;
}
const fmtNum = (n, d=2) => n==null ? '—' : n.toLocaleString('es-ES',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct = (x, d=1) => x==null ? 'N/D' : (x*100).toFixed(d).replace('.',',') + '%';
const pctSig = (x, d=1) => x==null ? 'N/D' : (x>0?'+':'') + pct(x,d);

/* ═══════════ Fechas ═══════════ */
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const dosD = (n) => String(n).padStart(2,'0');
const aISO = (d) => d.getFullYear() + '-' + dosD(d.getMonth()+1) + '-' + dosD(d.getDate());
function fechaDe(s){
  if(!has(s)) return null;
  const t = String(s).trim();
  let m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return new Date(+m[1], +m[2]-1, +m[3]);
  m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if(m){ let y=+m[3]; if(y<100) y+=2000; return new Date(y, +m[2]-1, +m[1]); }
  return null;
}
const isoDe = (s) => { const d = fechaDe(s); return d ? aISO(d) : ''; };
const hoyISO = () => aISO(new Date());
const fmtLargo = (d) => DIAS[d.getDay()] + ' ' + d.getDate() + ' de ' + MESES[d.getMonth()];
const fmtCorto = (d) => d.getDate() + ' ' + MESES[d.getMonth()].slice(0,3);
/* Lunes a viernes de la semana en curso, desplazada `off` semanas */
function semanaLV(off){
  const h = new Date(), dow = h.getDay();
  const lun = new Date(h);
  lun.setDate(h.getDate() - (dow===0 ? 6 : dow-1) + (off||0)*7);
  return Array.from({length:5}, (_,i) => { const d = new Date(lun); d.setDate(lun.getDate()+i); return d; });
}
const diasHasta = (iso) => {
  const d = fechaDe(iso); if(!d) return null;
  const h = new Date(); h.setHours(0,0,0,0); d.setHours(0,0,0,0);
  return Math.round((d - h) / 86400000);
};

/* Divisa y ticker de Yahoo desde el prefijo de bolsa de SIMBOLO_GF */
const DIVISA = {EPA:'€',BME:'€',ETR:'€',FRA:'€',BIT:'€',AMS:'€',EBR:'€',ELI:'€',VIE:'€',HEL:'€',
  LON:'£',NYSE:'$',NASDAQ:'$',NYSEARCA:'$',NYSEAMERICAN:'$',BATS:'$',OTCMKTS:'$',
  TSE:'CA$',CVE:'CA$',SWX:'CHF',VTX:'CHF',TYO:'¥',HKG:'HK$',ASX:'A$',STO:'kr',CPH:'kr',OSL:'kr'};
const SUFIJO = {EPA:'.PA',BME:'.MC',ETR:'.DE',FRA:'.DE',BIT:'.MI',AMS:'.AS',EBR:'.BR',ELI:'.LS',VIE:'.VI',HEL:'.HE',
  LON:'.L',LSE:'.L',SWX:'.SW',VTX:'.SW',TYO:'.T',HKG:'.HK',ASX:'.AX',TSE:'.TO',CVE:'.V',STO:'.ST',CPH:'.CO',OSL:'.OL',
  NYSE:'',NASDAQ:'',NYSEARCA:'',NYSEAMERICAN:'',BATS:'',OTCMKTS:''};
const prefijoDe = (gf) => has(gf) && String(gf).includes(':') ? String(gf).split(':')[0].trim().toUpperCase() : '';
function divisaDe(gf){ const p = prefijoDe(gf); return DIVISA[p] || ''; }
function yahooDe(gf, tk){
  const p = prefijoDe(gf);
  const s = has(gf) && gf.includes(':') ? gf.split(':')[1].trim() : (tk || '');
  return (s || '').toUpperCase() + (SUFIJO[p] ?? '');
}

/* ═══════════ Estado ═══════════ */
let fichas = [], historial = [], calendario = [], macro = [], pendientes = [], cartera = [], sectores = [], sel = null;
let filtroEstado = 'todas', query = '', vista = 'agenda';
let offCal = 0, offMacro = 0, calAjustado = false;
let workerUrl = localStorage.getItem(LS_WORKER) || '';

const COLS = ['TICKER','NOMBRE','SIMBOLO_GF','ESTADO','CARTERA','QUE_HACE','SECTOR','PRECIO','PER',
  'DITO_CRECE','DITO_VALORACION','DITO_DEUDA','DITO_RETRIBUCION','DITO_VEREDICTO',
  'ENTRADA_1','ENTRADA_2','SALIDA','TESIS_PITI','TESIS_IA','ULTIMOS_RESULTADOS',
  'PROXIMOS_RESULTADOS','QUE_VIGILAR','ACTUALIZADO'];

function aObjetos(rows, cols){
  if(!rows.length) return [];
  const head = rows[0].map(h => String(h).trim().toUpperCase());
  const idx = {};
  cols.forEach(c => { const i = head.indexOf(c); if(i >= 0) idx[c] = i; });
  cols.forEach((c,i) => { if(idx[c] == null) idx[c] = i; });
  return rows.slice(1).map(r => {
    const o = {};
    cols.forEach(c => { o[c] = (r[idx[c]] ?? '').toString().trim(); });
    return o;
  });
}
const filasAObjetos = (rows) => aObjetos(rows, COLS).filter(o => has(o.TICKER));

/* La cartera viene por bloques en columnas: una etiqueta arriba (swing, opciones…)
   y debajo pares ticker/nombre. Se recorre la rejilla entera para que siga
   funcionando si mañana añade un bloque más o cambia el orden.
   Un ticker puede traer prefijo de bolsa (tse:IVN): se queda con la parte del ticker. */
const limpiaTicker = (s) => {
  const t = String(s||'').trim();
  return (t.includes(':') ? t.split(':').pop() : t).trim().toUpperCase();
};
function parseCartera(rows){
  if(!rows.length) return [];
  const out = [], vistos = new Set();
  const ancho = Math.max(...rows.map(r => r.length));
  for(let c = 0; c < ancho; c++){
    const pares = rows.filter(r => has(r[c]) && has(r[c+1]));
    if(pares.length < 2) continue;                       // no es un bloque de tickers
    let etiqueta = '';
    for(const r of rows){                                // la etiqueta no tiene nombre al lado
      if(has(r[c]) && !has(r[c+1])){ etiqueta = String(r[c]).trim(); break; }
    }
    for(const r of pares){
      const tk = limpiaTicker(r[c]);
      if(!tk || tk === etiqueta.toUpperCase()) continue;
      if(vistos.has(tk)) continue;
      vistos.add(tk);
      out.push({TICKER: tk, NOMBRE: String(r[c+1]).trim(), CUENTA: etiqueta.toUpperCase()});
    }
  }
  return out;
}

/* ═══════════ Carga del Sheet ═══════════ */
async function pedir(tab){
  const r = await fetch(urlDe(tab));
  if(!r.ok) throw new Error('HTTP ' + r.status);
  const t = await r.text();
  if(/^\s*</.test(t)) throw new Error('ACCESO');
  return t;
}
const pedirSuave = (tab) => pedir(tab).catch(() => '');
async function pedirCartera(){
  for(const u of urlsCartera()){
    try{
      const r = await fetch(u);
      if(!r.ok) continue;
      const t = await r.text();
      if(/^\s*</.test(t) || !t.trim()) continue;   // devolvió HTML o nada: siguiente
      return t;
    }catch(e){ /* siguiente */ }
  }
  return '';
}

async function cargar(){
  const hs = $('#hstat');
  hs.innerHTML = '<b>—</b><span class="spin"></span>';
  try{
    const [f, h, c, m, p, ca, se] = await Promise.all([
      pedir('FICHAS'), pedirSuave('HISTORIAL'), pedirSuave('CALENDARIO'),
      pedirSuave('MACRO'), pedirSuave('PENDIENTES'), pedirCartera(), pedirSuave('SECTORES')
    ]);
    fichas = filasAObjetos(parseCSV(f));
    if(!fichas.length) throw new Error('VACIO');
    historial = aObjetos(parseCSV(h), ['FECHA','TICKER','AGENTE','NOTA']).filter(x => has(x.NOTA));
    calendario = aObjetos(parseCSV(c), ['FECHA','SESION','TICKER','NOMBRE','MERCADO','NOTA']).filter(x => has(x.TICKER));
    macro = aObjetos(parseCSV(m), ['FECHA','HORA','EVENTO','IMPORTANCIA','NOTA']).filter(x => has(x.EVENTO));
    pendientes = aObjetos(parseCSV(p), ['FECHA_LIMITE','ASUNTO','DETALLE','ESTADO','CREADO']).filter(x => has(x.ASUNTO));
    cartera = parseCartera(parseCSV(ca));
    sectores = aObjetos(parseCSV(se), ['SECTOR_YAHOO','NOMBRE_ES','PER','EV_EBITDA','P_FCF','FUENTE','ACTUALIZADO']).filter(x => has(x.SECTOR_YAHOO));
    try{ localStorage.setItem(LS, JSON.stringify({ts:Date.now(), fichas, historial, calendario, macro, pendientes, cartera, sectores})); }catch(e){}
    pintarTodo(new Date());
  }catch(e){
    let cache = null;
    try{ cache = JSON.parse(localStorage.getItem(LS) || 'null'); }catch(x){}
    if(cache && cache.fichas && cache.fichas.length){
      fichas = cache.fichas; historial = cache.historial || [];
      calendario = cache.calendario || []; macro = cache.macro || []; pendientes = cache.pendientes || [];
      cartera = cache.cartera || []; sectores = cache.sectores || [];
      pintarTodo(new Date(cache.ts), true);
    }else{
      $('#list').innerHTML = '';
      $('#agenda').innerHTML = mensajeError(e);
      $('#cal').innerHTML = ''; $('#macroV').innerHTML = '';
      $('#detail').innerHTML = mensajeError(e);
      hs.innerHTML = '<b>error</b>sin datos';
    }
  }
}
function mensajeError(e){
  const acceso = e && (e.message === 'ACCESO' || /HTTP 4|HTTP 5|Failed|NetworkError/i.test(e.message || ''));
  return '<div class="err"><b>No se pudo leer el Sheet FICHAS EMPRESAS.</b><br>' +
    (acceso
      ? 'El archivo no es legible desde fuera. En el Sheet: <b>Archivo → Compartir → Publicar en la web</b>, documento completo. Después recarga.'
      : 'Detalle: ' + esc(e && e.message || 'desconocido')) + '</div>';
}
function pintarTodo(ts, deCache){
  const n = fichas.length;
  $('#hstat').innerHTML = '<b>' + n + ' empresa' + (n===1?'':'s') + '</b>' +
    (deCache ? 'copia local' : ts.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}));
  pintarAgenda(); pintarCalendario(); pintarMacro(); pintarFiltros(); pintarLista();
  const hash = decodeURIComponent((location.hash || '').replace('#','')).toUpperCase();
  const quiere = sel || hash;
  if(quiere && fichas.some(f => f.TICKER.toUpperCase() === quiere)) abrir(quiere, true);
  else if(sel){ sel = null; $('#detail').innerHTML = '<div class="ph"><div class="big">Fichas</div><div>Elige una empresa de la lista.</div></div>'; }
}

/* ═══════════ Distancia a un nivel ═══════════ */
function distancia(precio, nivel, tipo){
  if(precio == null || nivel == null || precio <= 0 || nivel <= 0) return null;
  if(tipo === 'salida'){
    const falta = nivel / precio - 1;
    return falta <= 0
      ? {cls:'hit', txt:'objetivo alcanzado', corto:'objetivo'}
      : {cls: falta <= CERCA ? 'near' : 'far', txt:'falta ' + fmtNum(falta*100,1) + '%', corto:fmtNum(falta*100,0) + '%'};
  }
  const falta = precio / nivel - 1;
  return falta <= 0
    ? {cls:'hit', txt:'en nivel' + (falta < -0.001 ? ' (' + fmtNum(falta*100,1) + '%)' : ''), corto:'en nivel'}
    : {cls: falta <= CERCA ? 'near' : 'far', txt:'a ' + fmtNum(falta*100,1) + '% por debajo', corto:'a ' + fmtNum(falta*100,0) + '%'};
}
const norm = (tk) => String(tk||'').trim().toUpperCase();
const fichaDe = (tk) => fichas.find(f => norm(f.TICKER) === norm(tk)) || null;
const carteraDe = (tk) => cartera.find(c => norm(c.TICKER) === norm(tk)) || null;
const sectorDe = (s) => sectores.find(x => x.SECTOR_YAHOO.toLowerCase() === String(s||'').trim().toLowerCase()) || null;

/* Qué sabemos de un ticker. Dos fuentes: la ficha (si la tiene) y la pestaña
   CARTERA, que lleva su cartera completa aunque todavía no haya ficha.
   Devuelve null si el ticker no es suyo — esas filas van sin resaltar. */
function posicionDe(tk){
  const f = fichaDe(tk), c = carteraDe(tk);
  if(!f && !c) return null;
  const est = ((f && f.ESTADO) || 'cartera').toLowerCase();   // si está en el Sheet de cartera, la tiene
  if(est === 'descartada' && !c) return null;
  return {
    ficha: f,
    cuenta: (c && c.CUENTA) || (f && f.CARTERA) || '',
    clase: est === 'watchlist' && !c ? 'watchlist' : 'cartera',
    precio: f ? num(f.PRECIO) : null,           // el precio en vivo solo está en FICHAS
    entrada: f ? num(f.ENTRADA_1) : null
  };
}

/* Fila compacta, para las columnas de la semana */
/* En el calendario solo el día y la empresa: ni niveles, ni notas, ni precios */

/* Fila ancha, para la agenda */
function filaResultado(c){
  const p = posicionDe(c.TICKER);
  const f = p && p.ficha;
  const ses = (c.SESION || '').toUpperCase();
  const d = p ? distancia(p.precio, p.entrada, 'entrada') : null;

    ${has(c.NOTA) ? `<span class="er-nota">${esc(c.NOTA)}</span>` : ''}

}
/* Primero cartera, después watchlist, después el resto */
const ordenar = (arr) => [...arr].sort((a,b) => {
  const peso = (x) => { const p = posicionDe(x.TICKER); return !p?2:p.clase==='cartera'?0:1; };
  return peso(a) - peso(b) || String(a.TICKER).localeCompare(String(b.TICKER), 'es');
});
function bloqueSesion(titulo, arr, compacta){
  const cls = compacta ? 'col-s' : 'sesion';

const VERD = (t) => {
  const s = (t || '').toLowerCase();
  if(!s) return 'v-nd';
  if(/barat|infravalor/.test(s)) return 'v-barata';
  if(/\bcara\b|\bcaro\b|sobrevalor/.test(s)) return 'v-cara';
  if(/en precio|precio justo|razonable/.test(s)) return 'v-media';
  return 'v-nd';
};
/* Señal del pilar: solo cuando el texto arranca con una marca inequívoca */
function senal(txt){
  const s = (txt || '').trim().toLowerCase();
  if(!s) return {cls:'', mark:''};
  if(/^(sí|si)\b/.test(s) && !/^si\s+(se|cae|baja)/.test(s)) return {cls:'ok', mark:'cumple'};
  if(/^no\b/.test(s)) return {cls:'ko', mark:'no cumple'};
  if(/^(sin deuda|baja|muy baja|nula)\b/.test(s)) return {cls:'ok', mark:'bien'};
  if(/^(alta|muy alta|elevada)\b/.test(s)) return {cls:'ko', mark:'alto'};
  if(/^barat/.test(s)) return {cls:'ok', mark:'barata'};
  if(/^car[ao]\b/.test(s)) return {cls:'ko', mark:'cara'};
  if(/^(dividendo|recompra)/.test(s)) return /dilu(?!ción\b.*sin)/.test(s) && !/sin dilu/.test(s) ? {cls:'mid', mark:''} : {cls:'ok', mark:'retribuye'};
  if(/^(crece|pendiente|ha caído|ha caido)/.test(s)) return {cls:'mid', mark:''};
  return {cls:'', mark:''};
}
function pilar(label, txt){
  const s = senal(txt);
  return `<div class="pilar ${s.cls}">
    <div class="pt"><span>${esc(label)}</span>${s.mark?`<span class="pm">${esc(s.mark)}</span>`:''}</div>

}

}

/* ═══════════ VALORACIÓN (datos en vivo vía worker) ═══════════ */
const rv = (x) => (x && typeof x === 'object' && 'raw' in x) ? x.raw : (typeof x === 'number' ? x : null);
async function api(path){
  if(!workerUrl) throw new Error('SIN_WORKER');
  const r = await fetch(workerUrl.replace(/\/+$/,'') + path);
  if(!r.ok){ let m = 'Error ' + r.status; try{ const j = await r.json(); if(j.error) m += ': ' + j.error; }catch(e){} throw new Error(m); }
  return r.json();
}
function ordenarCandidatos(arr){
  const rank = (q) => { const e = (q.exchange||'').toUpperCase();
    if(['NMS','NYQ','NGM','NCM','ASE','PCX','BTS'].includes(e)) return 0;
    if(e === 'TOR') return 1;
    if(['LSE','GER','FRA','PAR','AMS','MCE','MIL','EBS','SWX','STO','CPH','HEL','BRU','LIS','VIE','TSE','HKG','ASX'].includes(e)) return 2;
    if(['VAN','NEO','AQS','SAO','MEX','IOB','PNK','CXE'].includes(e)) return 6;
    return 4; };
  arr.sort((a,b) => rank(a) - rank(b) || ((b.score||0) - (a.score||0)));
  return arr;
}
function tendencia(vals){
  if(!vals || vals.length < 3) return null;
  let ups = 0;
  for(let i=1;i<vals.length;i++) if(vals[i] >= vals[i-1]) ups++;
  const neto = vals[vals.length-1] > vals[0];
  return (ups >= vals.length-1 && neto) ? 'up' : (ups >= vals.length-2 && neto) ? 'mixed' : 'down';
}
function areaSpark(vals){
  if(!vals || vals.length < 2) return '';
  const W=96, H=28, imp=tendencia(vals);
  const mx=Math.max(...vals,0), mn=Math.min(...vals,0), rg=(mx-mn)||1;
  const Y=(v)=>H-2-((v-mn)/rg)*(H-4);
  const pts=vals.map((v,i)=>[(i/(vals.length-1))*W, Y(v)]);
  const col = imp==='up'?'var(--green)':imp==='down'?'var(--red)':'var(--warn)';
  const line = pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const lab = imp==='up'?'creciente':imp==='down'?'decreciente':'irregular';
  return `<span class="trendwrap" title="${vals.length} ejercicios anuales">
    <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
      <polygon points="0,${H} ${line} ${W},${H}" fill="${col}" opacity="0.16"/>
      <polyline points="${line}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linejoin="round"/>
    </svg><span class="trendlab" style="color:${col}">${lab}</span></span>`;
}
function miniBars(vals){
  if(!vals || vals.length < 3) return '';
  const imp = tendencia(vals);
  const w=9, gap=3, W=vals.length*(w+gap)-gap, H=22;
  const mx=Math.max(...vals,0), mn=Math.min(...vals,0), rg=(mx-mn)||1;
  const y0=H-((0-mn)/rg)*H;
  const col = imp==='up'?'var(--green)':imp==='down'?'var(--red)':'var(--warn)';
  const bars = vals.map((v,i)=>{
    const h=Math.max(Math.abs(v)/rg*H,1.5);
    const y=v>=0?Math.max(y0-h,0):y0;
    return `<rect x="${i*(w+gap)}" y="${y.toFixed(1)}" width="${w}" height="${h.toFixed(1)}" rx="1.5" fill="${col}" opacity="${(0.45+0.55*(i+1)/vals.length).toFixed(2)}"/>`;
  }).join('');
  const lab = imp==='up'?'creciente':imp==='down'?'decreciente':'irregular';
  return `<span class="trendwrap" title="Últimos ${vals.length} trimestres">
    <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${bars}</svg>
    <span class="trendlab" style="color:${col}">${lab}</span></span>`;
}
function mediana(a){
  if(!a || !a.length) return null;
  const b = [...a].sort((x,y) => x-y), n = b.length;
  return n % 2 ? b[(n-1)/2] : (b[n/2-1] + b[n/2]) / 2;
}
/* Al lado del múltiplo: su mediana histórica y, si está en la pestaña SECTORES
   del Sheet, la media del sector. El veredicto lo pone Piti. */
function chipMediana(hist, sec){
  const m = mediana(hist);
  return (m ? `<span class="med">mediana ${fmtNum(m,1)}x</span>`
            : '<span class="med" title="Yahoo no da histórico suficiente">sin histórico</span>')
       + (sec != null ? `<span class="med sec">sector ${fmtNum(sec,1)}x</span>` : '');
}
function aRow(label, valHtml, cls, extra, rng){
  return `<div class="crit">
    <span class="lbl">${esc(label)}${rng?` <span class="rng">${esc(rng)}</span>`:''}</span>
    <span class="dash">–</span>
    <span class="val ${cls||''}">${valHtml}</span>
    ${extra||''}
  </div>`;
}
async function traducir(t){
  try{
    const r = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=es&dt=t&q=${encodeURIComponent(t)}`);
    const j = await r.json();
    return j[0].map(x => x[0]).join('');
  }catch(e){ return t; }
}
function descES(el, resumen){
  const txt = resumen ? resumen.split('. ').slice(0,2).join('. ') + '.' : '';
  if(!txt){ el.textContent = ''; return; }
  el.textContent = txt;
  traducir(txt).then(t => { el.textContent = t; });
}

let aCtx = null;
const aviso = (tipo, html) => { const n = $('#aNotice'); n.className = 'notice ' + (tipo||''); n.innerHTML = html || ''; };

async function buscarA(){
  const term = $('#aq').value.trim();
  if(!term) return;
  if(!workerUrl){ abrirModal(); return; }
  const b = $('#aGo'); b.disabled = true; b.innerHTML = '<span class="spin"></span>';
  aviso('',''); $('#aCands').innerHTML = '';
  try{
    const j = await api('/search?q=' + encodeURIComponent(term));
    const cand = ordenarCandidatos((j.quotes||[]).filter(q => q.symbol && ['EQUITY','ETF'].includes(q.quoteType)));
    if(!cand.length){ aviso('err','No encontré nada para <b>'+esc(term)+'</b>.'); return; }
    let exacto = cand.find(c => c.symbol.toUpperCase() === term.toUpperCase());
    if(exacto && cand.indexOf(exacto) > 1) exacto = null;
    if(exacto || cand.length === 1){ await analizar((exacto||cand[0]).symbol); }
    else{
      aviso('info','Varios resultados. Elige la empresa:');
      $('#aCands').innerHTML = cand.slice(0,6).map(c => `<button class="cand" data-sym="${esc(c.symbol)}">
        <span class="sym">${esc(c.symbol)}</span>
        <span class="nm">${esc(c.shortname||c.longname||'')}</span>
        <span class="ex">${esc(c.exchDisp||c.exchange||'')}</span></button>`).join('');
    }
  }catch(e){
    if(String(e.message) === 'SIN_WORKER') abrirModal();
    else aviso('err','Error en la búsqueda: ' + esc(e.message));
  }finally{ b.disabled = false; b.textContent = 'Analizar'; }
}

async function analizar(t){
  t = String(t).toUpperCase();
  irA('analisis');
  $('#aq').value = t;
  if(!workerUrl){ abrirModal(); return; }
  const b = $('#aGo'); b.disabled = true; b.innerHTML = '<span class="spin"></span>';
  aviso('',''); $('#aCands').innerHTML = '';
  $('#aOut').innerHTML = '<div class="card"><span class="spin"></span> Leyendo fundamentales de ' + esc(t) + '…</div>';
  try{
    const [j, tsJ] = await Promise.all([
      api('/summary/' + encodeURIComponent(t) + '?modules=assetProfile,price,summaryDetail,defaultKeyStatistics,financialData,incomeStatementHistory,incomeStatementHistoryQuarterly,cashflowStatementHistory,cashflowStatementHistoryQuarterly,calendarEvents'),
      api('/timeseries/' + encodeURIComponent(t) + '?types=annualTotalRevenue,annualEBIT,annualOperatingIncome,annualFreeCashFlow,annualRepurchaseOfCapitalStock,annualCommonStockIssuance,annualInterestExpense,trailingInterestExpense,quarterlyInterestExpense,annualNetNonOperatingInterestIncomeExpense,annualInterestExpenseNonOperating,trailingFreeCashFlow,annualForwardPeRatio,annualPeRatio,annualEnterprisesValueEBITDARatio,annualPriceToFreeCashFlowsRatio&years=10').catch(() => null)
    ]);
    const m = j?.quoteSummary?.result?.[0];
    if(!m) throw new Error('"' + t + '" sin datos.');
    prepararA(t, m, tsJ);
    renderA();
  }catch(e){
    $('#aOut').innerHTML = '';
    if(String(e.message) === 'SIN_WORKER') abrirModal();
    else aviso('err','No se pudo analizar <b>'+esc(t)+'</b> — ' + esc(e.message));
  }finally{ b.disabled = false; b.textContent = 'Analizar'; }
}

function prepararA(t, m, tsJ){
  const P=m.price||{}, SD=m.summaryDetail||{}, KS=m.defaultKeyStatistics||{}, FD=m.financialData||{}, AP=m.assetProfile||{};
  const serie = (name) => {
    const res = (tsJ?.timeseries?.result||[]).find(r => r.meta?.type?.[0] === name);
    if(!res || !res[name]) return [];
    return res[name].filter(x => x && x.reportedValue && x.reportedValue.raw != null)
      .sort((a,b) => (a.asOfDate||'').localeCompare(b.asOfDate||'')).map(x => x.reportedValue.raw);
  };
  const revA = serie('annualTotalRevenue');
  let ebitA = serie('annualOperatingIncome'); if(!ebitA.length) ebitA = serie('annualEBIT');
  const fcfA = serie('annualFreeCashFlow');
  const buybackA = serie('annualRepurchaseOfCapitalStock');
  const issuanceA = serie('annualCommonStockIssuance');
  const revQ = (m.incomeStatementHistoryQuarterly?.incomeStatementHistory||[]).map(x => rv(x.totalRevenue)).filter(x => x!=null).reverse().slice(-4);
  const ebitQ = (m.incomeStatementHistoryQuarterly?.incomeStatementHistory||[]).map(x => rv(x.ebit) ?? rv(x.operatingIncome)).filter(x => x!=null).reverse().slice(-4);
  const cfQ = (m.cashflowStatementHistoryQuarterly?.cashflowStatements||[]).map(x => {
    const ocf = rv(x.totalCashFromOperatingActivities), capex = rv(x.capitalExpenditures);
    return ocf != null ? ocf + (capex||0) : null;
  }).filter(x => x!=null).reverse().slice(-4);
  const annIS = m.incomeStatementHistory?.incomeStatementHistory || [];
  const annCF = m.cashflowStatementHistory?.cashflowStatements || [];

  let interes = Math.abs(rv(annIS[0]?.interestExpense) || 0);
  const fb = ['annualInterestExpense','trailingInterestExpense','annualNetNonOperatingInterestIncomeExpense','annualInterestExpenseNonOperating'];
  for(const k of fb){ if(interes) break; const s = serie(k); if(s.length) interes = Math.abs(s[s.length-1]); }
  if(!interes){ const q = serie('quarterlyInterestExpense'); if(q.length) interes = Math.abs(q.slice(-4).reduce((a,b)=>a+b,0)); }
  let ebitAnual = rv(annIS[0]?.ebit) ?? rv(annIS[0]?.operatingIncome);
  if(ebitAnual == null && ebitA.length) ebitAnual = ebitA[ebitA.length-1];

  let buyback = rv(annCF[0]?.repurchaseOfStock);
  if(buyback == null && buybackA.length) buyback = buybackA[buybackA.length-1];
  const issuance = issuanceA.length ? issuanceA[issuanceA.length-1] : (rv(annCF[0]?.issuanceOfStock) || 0);
  const buyNeto = (buyback != null ? Math.abs(buyback) : 0) - (issuance || 0);

  const cap = rv(P.marketCap), ebitda = rv(FD.ebitda);
  const deuda = rv(FD.totalDebt), caja = rv(FD.totalCash);
  const trFcf = serie('trailingFreeCashFlow');
  const fcfTtm = trFcf.length ? trFcf[trFcf.length-1] : (fcfA.length ? fcfA[fcfA.length-1] : null);
  const limpia = (a, max) => a.filter(x => x > 0 && x < max);

  const fcfSerie = (() => { const a = fcfA.slice();
    if(fcfTtm != null && (!a.length || Math.abs(a[a.length-1]-fcfTtm)/Math.max(Math.abs(fcfTtm),1) > 0.02)) a.push(fcfTtm);
    return a.length ? a : null; })();

  aCtx = {
    t, nombre: P.shortName || P.longName || t,
    precio: rv(P.regularMarketPrice), chg: rv(P.regularMarketChangePercent), cap,
    sector: AP.sector||'', industria: AP.industry||'', resumen: AP.longBusinessSummary||'',
    revA: revA.length?revA:null, ebitA: ebitA.length?ebitA:null, fcfA: fcfSerie,
    revQ, ebitQ, cfQ,
    revYoY: rv(FD.revenueGrowth), epsYoY: rv(FD.earningsGrowth) ?? rv(KS.earningsQuarterlyGrowth),
    fcfUlt: fcfTtm != null ? fcfTtm : (fcfSerie ? fcfSerie[fcfSerie.length-1] : null),
    perFwd: rv(SD.forwardPE) ?? rv(KS.forwardPE),
    perHist: (() => { const a = limpia(serie('annualPeRatio'), 200); return a.length>=3?a:null; })(),
    perFwdHist: (() => { const a = limpia(serie('annualForwardPeRatio'), 200); return a.length>=3?a:null; })(),
    pfcf: (cap && fcfTtm && fcfTtm > 0) ? cap/fcfTtm : null,
    pfcfHist: (() => { const a = limpia(serie('annualPriceToFreeCashFlowsRatio'), 200); return a.length>=3?a:null; })(),
    evEbitda: rv(KS.enterpriseToEbitda),
    evHist: (() => { const a = limpia(serie('annualEnterprisesValueEBITDARatio'), 100); return a.length>=3?a:null; })(),
    ndEbitda: (deuda != null && caja != null && ebitda && ebitda > 0) ? (deuda-caja)/ebitda : null,
    deudaPat: (() => { const de = rv(FD.debtToEquity); return de != null ? de/100 : null; })(),
    cobertura: (ebitAnual && interes > 0) ? ebitAnual/interes : null,
    divYield: rv(SD.dividendYield),
    buyNetoPct: (cap && (buyback != null || issuance)) ? buyNeto/cap : null,
  };
}

function renderA(){
  const c = aCtx, t = c.t;
  const spark = (anual, trim) => anual ? areaSpark(anual) : miniBars(trim);
  const clsTend = (anual, trim) => { const i = tendencia(anual||trim); return i==='up'?'ok':i==='down'?'ko':i?'mid':'nd'; };

  const filas = [];
  // 1. Gana dinero y crece — solo el porcentaje, no el importe
  filas.push(aRow('Ventas', c.revYoY != null ? pctSig(c.revYoY) : 'N/D',
    c.revYoY == null ? 'nd' : c.revYoY > 0 ? 'ok' : 'ko', spark(c.revA, c.revQ), 'interanual'));
  filas.push(aRow('Beneficio', c.epsYoY != null ? pctSig(c.epsYoY) : 'N/D',
    c.epsYoY == null ? 'nd' : c.epsYoY > 0 ? 'ok' : 'ko', spark(c.ebitA, c.ebitQ), 'BPA interanual'));
  // FCF: solo si hace caja o no
  const haceCaja = c.fcfUlt == null ? null : c.fcfUlt > 0;
  filas.push(aRow('Flujo de caja libre',
    haceCaja == null ? 'N/D' : haceCaja ? 'Hace caja' : 'Quema caja',
    haceCaja == null ? 'nd' : haceCaja ? 'ok' : 'ko', spark(c.fcfA, c.cfQ)));
  // 2. Múltiplos: el dato, su mediana y la media del sector. Sin veredicto.
  const S = sectorDe(c.sector);
  filas.push(aRow('PER forward', c.perFwd != null ? fmtNum(c.perFwd,1)+'x' : 'N/D',
    c.perFwd==null?'nd':'', chipMediana(c.perFwdHist || c.perHist, S ? num(S.PER) : null)));
  filas.push(aRow('P/FCF', c.pfcf != null ? fmtNum(c.pfcf,1)+'x' : 'N/D',
    c.pfcf==null?'nd':'', chipMediana(c.pfcfHist, S ? num(S.P_FCF) : null)));
  filas.push(aRow('EV/EBITDA', c.evEbitda != null ? fmtNum(c.evEbitda,1)+'x' : 'N/D',
    c.evEbitda==null?'nd':'', chipMediana(c.evHist, S ? num(S.EV_EBITDA) : null)));
  // 3. Deuda
  filas.push(aRow('Deuda neta / EBITDA', c.ndEbitda != null ? fmtNum(c.ndEbitda,2)+'x' : 'N/D',
    c.ndEbitda==null?'nd':c.ndEbitda<3?'ok':c.ndEbitda<=4?'mid':'ko', '', 'menos de 3x'));
  filas.push(aRow('Deuda / patrimonio', c.deudaPat != null ? fmtNum(c.deudaPat,2)+'x' : 'N/D',
    c.deudaPat==null?'nd':c.deudaPat<1?'ok':c.deudaPat<=2?'mid':'ko'));
  if(c.cobertura != null) filas.push(aRow('Cobertura de intereses', fmtNum(c.cobertura,1)+'x',
    c.cobertura>=6?'ok':c.cobertura>=3?'mid':'ko', '', 'EBIT entre intereses'));
  // 4. Retribución
  filas.push(aRow('Dividendo', c.divYield != null ? pct(c.divYield) : 'No paga', c.divYield!=null?'ok':''));
  filas.push(aRow('Recompras',
    c.buyNetoPct == null ? 'N/D'
      : c.buyNetoPct > 0.001 ? '+' + pct(c.buyNetoPct) + ' recompra neta'
      : c.buyNetoPct < -0.001 ? pct(c.buyNetoPct) + ' dilución'
      : '≈0%',
    c.buyNetoPct==null?'nd':c.buyNetoPct>0.001?'ok':c.buyNetoPct<-0.001?'ko':''));

  const nDeuda = c.cobertura != null ? 9 : 8;
  const sinDatos = c.perFwd==null && c.evEbitda==null && c.cap==null && !c.revA && !c.revQ.length;
  const precio = c.precio != null ? fmtNum(c.precio,2) : '—';

  $('#aOut').innerHTML = `
    <div class="dhead" style="margin-top:18px">
      <div class="dname">${esc(c.nombre)}<span class="dtick">${esc(t)}</span></div>
      <div class="dchips">
        ${c.sector ? `<span class="chip">${esc(c.sector)}</span>` : ''}
        ${c.industria ? `<span class="chip">${esc(c.industria)}</span>` : ''}
      </div>
      <div class="quote">
        <span class="q-price">${precio}</span>
        ${c.chg != null ? `<span class="q-per" style="color:${c.chg>=0?'var(--green)':'var(--red)'}">${pctSig(c.chg)}</span>` : ''}
      </div>
      <div class="desc" id="aDesc"></div>
    </div>
    ${sinDatos ? '<div class="err">Este listado apenas publica fundamentales: suele ser una cotización secundaria. Busca el listado principal.</div>' : ''}
    <div class="pane" style="border-radius:13px;margin-top:16px">
      <h4 class="sec">Gana dinero y crece</h4>${filas.slice(0,3).join('')}
      <h4 class="sec">Múltiplos y su mediana histórica</h4>${filas.slice(3,6).join('')}
      <h4 class="sec">Deuda</h4>${filas.slice(6,nDeuda).join('')}
      <h4 class="sec">Retribución al accionista</h4>${filas.slice(nDeuda).join('')}
      <div class="foot">Datos de Yahoo Finance vía tu worker. Dato no verificado contra la fuente original: para una tesis, confirma las cifras en el informe de la compañía.</div>
    </div>`;
  descES($('#aDesc'), c.resumen);
  $('#aOut').scrollIntoView({behavior:'smooth', block:'start'});
}

/* ═══════════ Navegación ═══════════ */
function irA(v){
  vista = v;
  document.querySelectorAll('.nv').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  document.querySelectorAll('.view').forEach(s => s.classList.toggle('on', s.id === 'view-' + v));
  $('#fpanel').classList.toggle('on', v === 'fichas');
  document.body.classList.toggle('movil-fichas', v === 'fichas');
  if(v !== 'analisis') window.scrollTo(0,0);
}
document.querySelector('.menu').addEventListener('click', e => {
  const b = e.target.closest('[data-view]'); if(!b) return;
  irA(b.dataset.view);
});

}));

  const b = e.target.closest('[data-ir]'); if(b) irAFicha(b.dataset.ir);
});
$('#list').addEventListener('click', e => {
  const b = e.target.closest('[data-tk]'); if(!b) return;
  abrir(b.dataset.tk);
});
$('#detail').addEventListener('click', e => {

$('#fEstado').addEventListener('click', e => {
  const b = e.target.closest('[data-est]'); if(!b) return;
  filtroEstado = b.dataset.est; pintarFiltros(); pintarLista();
});
$('#q').addEventListener('input', e => { query = e.target.value; $('#clr').hidden = !query; pintarLista(); });
$('#clr').addEventListener('click', () => { query=''; $('#q').value=''; $('#clr').hidden=true; pintarLista(); $('#q').focus(); });
$('#aGo').addEventListener('click', buscarA);
$('#aq').addEventListener('keydown', e => { if(e.key === 'Enter') buscarA(); });
$('#aCands').addEventListener('click', e => {

  const tk = decodeURIComponent((location.hash || '').replace('#','')).toUpperCase();
  if(tk) irAFicha(tk);
  else { sel = null; pintarLista(); }
});

if((location.hash || '').length > 1) irA('fichas');
cargar();
